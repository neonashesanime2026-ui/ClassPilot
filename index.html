<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-assessment | A online e-learning platform for schools & individuals</title>
<meta name="description" content="A online e-learning platform for schools & individuals">
<meta name="author" content="Ktech Empires">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Welcome to E-assessment</h1>
<div id="stu">
<h2>Student signup</h2>
<form>
<label for="name">Full name:</label>
<input type="text" id="name" name="name" placeholder="Firstname Surname">
<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="#12kings">
<label for="studentClass">Class:</label>
<select id="studentClass" name="studentClass">
<option value="SS1">SS1</option>
<option value="SS2">SS2</option>
<option value="SS3">SS3</option>
</select>
<button type="button" onclick="registerStudent()">Enter</button>
</form>
</div>
<script src="app.js"></script>
</body>
</html>
