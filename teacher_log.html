<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClassPilot | Teacher Login</title>
<meta name="description" content="Teacher login for ClassPilot">
<meta name="author" content="Ktech Empires">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Welcome to ClassPilot</h1>
<div id="stu">
<h2>Teacher Login</h2>
<form>
<label for="teacherLoginName">Full name:</label>
<input type="text" id="teacherLoginName" name="teacherLoginName" placeholder="Teacher's full name" autocomplete="username">

<label for="teacherLoginPassword">Password:</label>
<input type="password" id="teacherLoginPassword" name="teacherLoginPassword" placeholder="Enter your password" autocomplete="current-password">

<button type="button" onclick="loginTeacher()">Log In</button>
</form>
<p>New teacher? <a href="teacher.html">Create a teacher account</a></p>
</div>
<script src="app.js"></script>
</body>
</html>
