<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClassPilot | Teacher Sign Up</title>
<meta name="description" content="Register a teacher account for ClassPilot">
<meta name="author" content="Ktech Empires">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Welcome to ClassPilot</h1>
<div id="stu">
<h2>Teacher Sign Up</h2>
<form>
<label for="teacherName">Full name:</label>
<input type="text" id="teacherName" name="teacherName" placeholder="Teacher's full name" autocomplete="name">

<label for="teacherPassword">Password:</label>
<input type="password" id="teacherPassword" name="teacherPassword" placeholder="Create a password" autocomplete="new-password">

<button type="button" onclick="registerTeacher()">Create Teacher Account</button>
</form>
<p>Already registered? <a href="teacher_log.html">Teacher login</a></p>
</div>
<script src="app.js"></script>
</body>
</html>
